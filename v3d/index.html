<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎾 TENNIS! — IBM Bob Edition v3d</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a6b2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      max-width: 100vw;
      max-height: 95vh;
    }

    #muteBtn {
      position: fixed;
      top: 12px;
      right: 16px;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      border-radius: 8px;
      color: #fff;
      font-size: 22px;
      padding: 8px 14px;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      min-width: 48px;
      min-height: 48px;
    }
    #muteBtn:hover { background: rgba(255,255,255,0.35); }
  </style>
</head>
<body>

<button id="muteBtn" title="Toggle sound">🔊</button>
<canvas id="gameCanvas" width="800" height="560"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
//  CONFIGURATION — customise for your event / nonprofit
// ═══════════════════════════════════════════════════════════════════════════════
const CONFIG = {
  nonprofitName:  'IBM Community',
  gameTitle:      '🎾 TENNIS!',
  poweredBy:      'Powered by IBM Bob',
  scoreToWin:     5,    // points to win a set
  setsToWin:      2,    // sets needed to win match (best of 3 → 2)
  themes: {
    classic: {
      court: '#3a8a40', courtAlt: '#2e7333', sky: '#87ceeb',
      playerPad: '#2979ff', cpuPad: '#ff6d00',
      ball: '#f9e44a', ballInner: '#fff176',
      name: 'Classic'
    },
    night: {
      court: '#1a237e', courtAlt: '#283593', sky: '#0d0d2b',
      playerPad: '#00e5ff', cpuPad: '#ff4081',
      ball: '#ffffff', ballInner: '#e0e0e0',
      name: 'Night'
    },
    clay: {
      court: '#b5451b', courtAlt: '#9c3d18', sky: '#ffa040',
      playerPad: '#ffd600', cpuPad: '#7c4dff',
      ball: '#ffffff', ballInner: '#f5f5f5',
      name: 'Clay'
    },
  },
  ballEmojis: ['🎾', '⚽', '🏀', '🌟', '❤️'],
};

const DIFFICULTY = {
  easy:   { cpuSpeed: 2.4, missFactor: 0.70, label: 'Easy',   color: '#43a047' },
  medium: { cpuSpeed: 3.2, missFactor: 0.82, label: 'Medium', color: '#fb8c00' },
  hard:   { cpuSpeed: 4.8, missFactor: 0.93, label: 'Hard',   color: '#e53935' },
};

// ═══════════════════════════════════════════════════════════════════════════════
//  v3d FEATURE SETTINGS (all three v3 additions combined)
// ═══════════════════════════════════════════════════════════════════════════════

// v3a — progressive difficulty
const CPU_SPEED_BOOST_PER_LEVEL = 0.22;
const POINTS_PER_LEVEL          = 2;
const MAX_LEVEL_BOOSTS          = 8;

// v3a — ball trail
const TRAIL_LENGTH      = 8;
const TRAIL_ALPHA_START = 0.35;

// v3b — power-ups
const POWERUP_TYPES = [
  { id: 'speed', emoji: '⚡', label: 'SPEED BOOST!',  color: '#ffeb3b', duration: 300 },
  { id: 'grow',  emoji: '🛡️', label: 'BIG PADDLE!',   color: '#4fc3f7', duration: 350 },
  { id: 'aim',   emoji: '🎯', label: 'AIM ASSIST!',   color: '#ce93d8', duration: 280 },
];
const POWERUP_SPAWN_MIN  = 180;
const POWERUP_SPAWN_MAX  = 360;
const POWERUP_RADIUS     = 18;
const GROW_BONUS         = 36;
const SPEED_MULT_MAX     = 0.7;  // fraction of BALL_SPEED_MAX used for speed boost
const AIM_REDUCTION      = 0.55;

// ═══════════════════════════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════════
const W = 800, H = 560;
const PADDLE_W = 14, PADDLE_H = 90;
const BALL_R = 11;
const PLAYER_X = 30, CPU_X = W - 30 - PADDLE_W;
const BALL_SPEED_INIT = 5;
const BALL_SPEED_MAX  = 12;
const BALL_SPEED_INC  = 0.35;
const PLAYER_SPEED    = 7;

// ═══════════════════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════════════════
let phase = 'name';  // name | setup | serve | play | point | setEnd | matchEnd
let twoPlayer        = false;
let currentDiff      = 'easy';
let currentTheme     = 'classic';
let currentBallEmoji = null;
let playerName       = 'YOU';
let p2Name           = 'P2';

// Per-point
let playerScore = 0, cpuScore = 0;
let lastScorer  = null;
let pointDelay  = 0;
let ball, playerPad, cpuPad;
let ballSpeedMult = 1;

// v3a — progressive difficulty
let diffLevel    = 0;
let totalPoints  = 0;

// v3a — ball trail
let trail = [];

// v3b — power-ups
let activePowerup  = null;
let playerEffect   = null;
let cpuEffect      = null;
let spawnCountdown = 0;
let flashMsg       = null;

// v3c — tournament / sets
let playerSets   = 0, cpuSets = 0;
let setHistory   = [];
let setEndDelay  = 0;

let keys       = {};
let muted      = false;
let audioCtx   = null;

const setupBtns = {};
let setupSelection = { diff: 'easy', theme: 'classic', emoji: 0, twoPlayer: false };

let stats = { wins: 0, losses: 0, streak: 0, bestStreak: 0 };
try {
  const saved = JSON.parse(localStorage.getItem('ibmTennisStats') || '{}');
  Object.assign(stats, saved);
} catch(e) {}
function saveStats() {
  try { localStorage.setItem('ibmTennisStats', JSON.stringify(stats)); } catch(e) {}
}

let nameBuffer   = '';
let p2Buffer     = '';
let namingP2     = false;

let confetti = [];

// ═══════════════════════════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════════════════════════
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.15) {
  if (muted) return;
  try {
    const ctx = getAudio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playPock()     { beep(500, 0.07); }
function playWall()     { beep(300, 0.04); }
function playCheer()    { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, 'sine', 0.14), i*120)); }
function playSetWin()   { [523,659,784,880,1047,784].forEach((f,i) => setTimeout(() => beep(f, 0.18, 'sine', 0.16), i*100)); }
function playWin()      { [523,659,784,659,1047,784,1047,1319].forEach((f,i) => setTimeout(() => beep(f, 0.22, 'sine', 0.18), i*130)); }
function playClick()    { beep(880, 0.04, 'sine', 0.08); }
function playLevelUp()  { [660, 880, 1100].forEach((f,i) => setTimeout(() => beep(f, 0.12, 'sine', 0.12), i*90)); }
function playPowerup()  { [660, 880, 1320].forEach((f,i) => setTimeout(() => beep(f, 0.1, 'sine', 0.13), i*70)); }

// ═══════════════════════════════════════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════════════════════════════════════
function spawnConfetti(count = 80) {
  const colors = ['#f9e44a','#2979ff','#ff6d00','#43a047','#e53935','#ffffff','#7c4dff'];
  for (let i = 0; i < count; i++) {
    confetti.push({
      x: Math.random() * W, y: -10,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 4 + 2,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2,
      life: 1,
    });
  }
}
function updateConfetti() {
  confetti = confetti.filter(c => c.life > 0);
  confetti.forEach(c => {
    c.x += c.vx; c.y += c.vy; c.rot += c.rotV;
    c.vy += 0.1; c.life -= 0.008;
  });
}
function drawConfetti(ctx) {
  confetti.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = c.life;
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/4, c.size, c.size/2);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  v3b POWER-UP HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
function resetSpawnCountdown() {
  spawnCountdown = POWERUP_SPAWN_MIN + Math.floor(Math.random() * (POWERUP_SPAWN_MAX - POWERUP_SPAWN_MIN));
}
function spawnPowerup() {
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  activePowerup = { x: W*0.3 + Math.random()*W*0.4, y: H*0.2 + Math.random()*H*0.6, type, pulse: 0 };
}
function applyEffect(side, typeId) {
  const def = POWERUP_TYPES.find(t => t.id === typeId);
  if (side === 'player') playerEffect = { id: typeId, framesLeft: def.duration };
  else                   cpuEffect    = { id: typeId, framesLeft: def.duration };
  flashMsg = { text: def.emoji + ' ' + def.label, color: def.color, life: 1 };
  playPowerup();
}
function effectivePaddleH(side) {
  const eff = side === 'player' ? playerEffect : cpuEffect;
  if (eff && eff.id === 'grow') return PADDLE_H + GROW_BONUS;
  return PADDLE_H;
}
function effectiveBallSpeedBoost() {
  return (playerEffect?.id === 'speed' || cpuEffect?.id === 'speed');
}
function effectiveMissFactor(baseMiss) {
  if (playerEffect?.id === 'aim') return Math.min(baseMiss * (1 / AIM_REDUCTION), 0.98);
  if (cpuEffect?.id    === 'aim') return baseMiss * AIM_REDUCTION;
  return baseMiss;
}
function tickEffects() {
  if (playerEffect) { playerEffect.framesLeft--; if (playerEffect.framesLeft <= 0) playerEffect = null; }
  if (cpuEffect)    { cpuEffect.framesLeft--;    if (cpuEffect.framesLeft    <= 0) cpuEffect    = null; }
  if (flashMsg)     { flashMsg.life -= 0.015;    if (flashMsg.life           <= 0) flashMsg     = null; }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  v3a PROGRESSIVE SPEED
// ═══════════════════════════════════════════════════════════════════════════════
function effectiveCpuSpeed() {
  return DIFFICULTY[currentDiff].cpuSpeed + diffLevel * CPU_SPEED_BOOST_PER_LEVEL;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════════════════════════════════
function resetBall(server = 'player') {
  const angle = (Math.random() * 40 - 20) * Math.PI / 180;
  const dir = server === 'player' ? 1 : -1;
  ball = { x: W/2, y: H/2, vx: dir * BALL_SPEED_INIT * Math.cos(angle), vy: BALL_SPEED_INIT * Math.sin(angle) };
  ballSpeedMult = 1;
  trail = [];
}
function resetPaddles() {
  playerPad = { x: PLAYER_X, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
  cpuPad    = { x: CPU_X,    y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
}
function startSet() {
  playerScore = 0; cpuScore = 0;
  totalPoints = 0; diffLevel = 0;
  confetti = [];
  activePowerup = null; playerEffect = null; cpuEffect = null; flashMsg = null;
  resetSpawnCountdown();
  resetPaddles();
  resetBall('player');
  phase = 'serve';
}
function startMatch() {
  playerSets = 0; cpuSets = 0;
  setHistory = [];
  startSet();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════════════════════════
function updatePlay() {
  const diff = DIFFICULTY[currentDiff];

  tickEffects();

  const ph = effectivePaddleH('player');
  const ch = effectivePaddleH('cpu');

  // Player 1
  if ((keys['ArrowUp']   || keys['w'] || keys['W']) && playerPad.y > 0)      playerPad.y -= PLAYER_SPEED;
  if ((keys['ArrowDown'] || keys['s'] || keys['S']) && playerPad.y < H - ph) playerPad.y += PLAYER_SPEED;

  // Player 2 or CPU
  if (twoPlayer) {
    if ((keys['i'] || keys['I']) && cpuPad.y > 0)       cpuPad.y -= PLAYER_SPEED;
    if ((keys['k'] || keys['K']) && cpuPad.y < H - ch)  cpuPad.y += PLAYER_SPEED;
  } else {
    const center = cpuPad.y + ch / 2;
    const miss   = effectiveMissFactor(diff.missFactor);
    const target = ball.y * miss + (H / 2) * (1 - miss);
    const spd    = effectiveCpuSpeed();
    if (center < target - 5 && cpuPad.y < H - ch) cpuPad.y += spd;
    else if (center > target + 5 && cpuPad.y > 0)  cpuPad.y -= spd;
  }

  // Trail record (before move)
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > TRAIL_LENGTH) trail.shift();

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y - BALL_R <= 0)  { ball.y = BALL_R;        ball.vy =  Math.abs(ball.vy); playWall(); }
  if (ball.y + BALL_R >= H)  { ball.y = H - BALL_R;    ball.vy = -Math.abs(ball.vy); playWall(); }

  function paddleHit(pad, padH, newVxSign) {
    const hitPos = (ball.y - pad.y) / padH - 0.5;
    ball.vx = newVxSign * Math.abs(ball.vx);
    ball.vy = hitPos * 9;
    if (effectiveBallSpeedBoost()) {
      const target = BALL_SPEED_MAX * SPEED_MULT_MAX;
      const len = Math.hypot(ball.vx, ball.vy);
      ball.vx = (ball.vx / len) * target;
      ball.vy = (ball.vy / len) * target;
    } else {
      ballSpeedMult = Math.min(ballSpeedMult + BALL_SPEED_INC / BALL_SPEED_INIT, BALL_SPEED_MAX / BALL_SPEED_INIT);
      ball.vx *= ballSpeedMult;
      ball.vy *= ballSpeedMult;
    }
    playPock();
  }

  // Player paddle
  if (ball.vx < 0 &&
      ball.x - BALL_R <= playerPad.x + playerPad.w &&
      ball.x - BALL_R >= playerPad.x - 4 &&
      ball.y + BALL_R >= playerPad.y &&
      ball.y - BALL_R <= playerPad.y + ph) {
    paddleHit(playerPad, ph, 1);
    ball.x = playerPad.x + playerPad.w + BALL_R;
  }
  // CPU paddle
  if (ball.vx > 0 &&
      ball.x + BALL_R >= cpuPad.x &&
      ball.x + BALL_R <= cpuPad.x + cpuPad.w + 4 &&
      ball.y + BALL_R >= cpuPad.y &&
      ball.y - BALL_R <= cpuPad.y + ch) {
    paddleHit(cpuPad, ch, -1);
    ball.x = cpuPad.x - BALL_R;
  }

  // Power-up spawn/collect
  spawnCountdown--;
  if (spawnCountdown <= 0 && !activePowerup) spawnPowerup();
  if (activePowerup) {
    activePowerup.pulse++;
    if (Math.hypot(ball.x - activePowerup.x, ball.y - activePowerup.y) < BALL_R + POWERUP_RADIUS) {
      const side = ball.vx > 0 ? 'player' : 'cpu';
      applyEffect(side, activePowerup.type.id);
      activePowerup = null;
      resetSpawnCountdown();
    }
  }

  // Score
  if (ball.x + BALL_R < 0)  { cpuScore++;    lastScorer = 'cpu';    playCheer(); endPoint(); }
  if (ball.x - BALL_R > W)  { playerScore++; lastScorer = 'player'; playCheer(); endPoint(); }
}

function endPoint() {
  totalPoints++;
  activePowerup = null; playerEffect = null; cpuEffect = null;
  resetSpawnCountdown();

  // Progressive difficulty level-up
  if (!twoPlayer) {
    const newLevel = Math.min(Math.floor(totalPoints / POINTS_PER_LEVEL), MAX_LEVEL_BOOSTS);
    if (newLevel > diffLevel) { diffLevel = newLevel; playLevelUp(); }
  }

  if (playerScore >= CONFIG.scoreToWin || cpuScore >= CONFIG.scoreToWin) {
    // Set over
    setHistory.push({ p: playerScore, c: cpuScore });
    const playerWonSet = playerScore >= CONFIG.scoreToWin;
    if (playerWonSet) playerSets++; else cpuSets++;
    playSetWin();
    spawnConfetti(50);

    if (playerSets >= CONFIG.setsToWin || cpuSets >= CONFIG.setsToWin) {
      const playerWon = playerSets >= CONFIG.setsToWin;
      if (playerWon) { stats.wins++; stats.streak++; stats.bestStreak = Math.max(stats.streak, stats.bestStreak); }
      else           { stats.losses++; stats.streak = 0; }
      saveStats();
      spawnConfetti(120);
      playWin();
      phase = 'matchEnd';
    } else {
      phase = 'setEnd';
      setEndDelay = 180;
    }
  } else {
    phase = 'point';
    pointDelay = 80;
  }
}

function update() {
  if (phase === 'play')     { updatePlay(); updateConfetti(); }
  if (phase === 'matchEnd') { updateConfetti(); }
  if (phase === 'point') {
    pointDelay--;
    if (pointDelay <= 0) { resetPaddles(); resetBall(lastScorer === 'cpu' ? 'cpu' : 'player'); phase = 'serve'; }
  }
  if (phase === 'setEnd') {
    updateConfetti();
    setEndDelay--;
    if (setEndDelay <= 0) startSet();
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function theme() { return CONFIG.themes[currentTheme]; }

function drawCourt() {
  const t = theme();
  const sky = ctx.createLinearGradient(0, 0, 0, 70);
  sky.addColorStop(0, t.sky); sky.addColorStop(1, t.court);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 70);
  ctx.fillStyle = t.court; ctx.fillRect(0, 70, W, H - 70);
  ctx.fillStyle = t.courtAlt;
  ctx.fillRect(W*0.25, H*0.15, W*0.25, H*0.7);
  ctx.fillRect(W*0.5,  H*0.15, W*0.25, H*0.7);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
  ctx.setLineDash([12, 8]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
  [[W*0.25,H*0.15,W*0.75,H*0.15],[W*0.25,H*0.85,W*0.75,H*0.85],
   [W*0.25,H*0.15,W*0.25,H*0.85],[W*0.75,H*0.15,W*0.75,H*0.85]].forEach(([x1,y1,x2,y2]) => {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
}

function paddleColor(side) {
  const eff = side === 'player' ? playerEffect : cpuEffect;
  if (!eff) return side === 'player' ? theme().playerPad : theme().cpuPad;
  return POWERUP_TYPES.find(t => t.id === eff.id).color;
}

function drawPaddle(pad, side) {
  const ph = effectivePaddleH(side);
  ctx.fillStyle = paddleColor(side);
  ctx.beginPath(); ctx.roundRect(pad.x, pad.y, pad.w, ph, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.roundRect(pad.x+2, pad.y+4, pad.w-4, ph/3, 4); ctx.fill();
  const eff = side === 'player' ? playerEffect : cpuEffect;
  if (eff) {
    const def = POWERUP_TYPES.find(t => t.id === eff.id);
    const pct = eff.framesLeft / def.duration;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(pad.x-1, pad.y-10, pad.w+2, 6);
    ctx.fillStyle = def.color;          ctx.fillRect(pad.x-1, pad.y-10, (pad.w+2)*pct, 6);
  }
}

function drawTrail() {
  if (trail.length < 2) return;
  const t = theme();
  for (let i = 0; i < trail.length; i++) {
    const age = (i + 1) / trail.length;
    const alpha = age * TRAIL_ALPHA_START;
    const radius = BALL_R * (0.4 + age * 0.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    if (currentBallEmoji) {
      ctx.font = `${radius * 2.2}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(currentBallEmoji, trail[i].x, trail[i].y);
      ctx.textBaseline = 'alphabetic';
    } else {
      ctx.fillStyle = t.ball;
      ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, radius, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBall() {
  const t = theme();
  if (currentBallEmoji) {
    ctx.font = `${BALL_R * 2.2}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(currentBallEmoji, ball.x, ball.y);
    ctx.textBaseline = 'alphabetic';
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(ball.x+3, ball.y+3, BALL_R, BALL_R*0.7, 0, 0, Math.PI*2); ctx.fill();
    const g = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, BALL_R);
    g.addColorStop(0, t.ballInner); g.addColorStop(1, t.ball);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(150,100,0,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*0.7, 0.3, Math.PI+0.3); ctx.stroke();
  }
}

function drawActivePowerup() {
  if (!activePowerup) return;
  const { x, y, type, pulse } = activePowerup;
  const scale = 1 + 0.12 * Math.sin(pulse * 0.12);
  const alpha = 0.85 + 0.15 * Math.sin(pulse * 0.1);
  ctx.save(); ctx.globalAlpha = alpha * 0.45; ctx.fillStyle = type.color;
  ctx.beginPath(); ctx.arc(x, y, (POWERUP_RADIUS+6)*scale, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(x, y, POWERUP_RADIUS*scale, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha = 1;
  ctx.font = `${POWERUP_RADIUS*1.3*scale}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(type.emoji, x, y); ctx.restore();
}

function drawFlashMsg() {
  if (!flashMsg || flashMsg.life <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(flashMsg.life * 2, 1);
  ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = flashMsg.color;
  const scale = 1 + (1 - flashMsg.life) * 0.3;
  ctx.translate(W/2, H/2 - 60); ctx.scale(scale, scale);
  ctx.fillText(flashMsg.text, 0, 0);
  ctx.restore();
}

function drawScore() {
  const p2Label = twoPlayer ? p2Name : 'BOB';
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px Arial';
  ctx.fillText(playerScore, W/2 - 75, 50);
  ctx.fillText(cpuScore,    W/2 + 75, 50);
  ctx.font = 'bold 26px Arial'; ctx.fillText('—', W/2, 50);
  ctx.font = '13px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(playerName.toUpperCase().slice(0,8), W/2 - 75, 64);
  ctx.fillText(p2Label.toUpperCase().slice(0,8),     W/2 + 75, 64);

  // Set dots
  const maxSets = CONFIG.setsToWin * 2 - 1;
  for (let i = 0; i < maxSets; i++) {
    ctx.beginPath(); ctx.arc(W/2 - 40 + i*0 - 30 + i*18, 78, 7, 0, Math.PI*2);
    ctx.fillStyle = i < playerSets ? '#ffd600' : 'rgba(255,255,255,0.25)'; ctx.fill();
  }
  for (let i = 0; i < maxSets; i++) {
    ctx.beginPath(); ctx.arc(W/2 + 40 - (maxSets-1)*9 + i*18, 78, 7, 0, Math.PI*2);
    ctx.fillStyle = i < cpuSets ? '#ffd600' : 'rgba(255,255,255,0.25)'; ctx.fill();
  }
  ctx.font = '11px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.textAlign = 'center';
  ctx.fillText(`SET ${playerSets + cpuSets + 1}`, W/2, 81);

  // Level badge (1P only)
  if (!twoPlayer && diffLevel > 0) {
    ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#ff8a65'; ctx.textAlign = 'right';
    ctx.fillText(`⚡ LVL ${diffLevel+1}`, W - 8, 20);
  }

  // Bottom ribbon — set history or stats
  ctx.textAlign = 'center';
  if (setHistory.length > 0) {
    ctx.font = '11px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('Sets: ' + setHistory.map(s => `${s.p}-${s.c}`).join('  '), W/2, H - 8);
  } else {
    ctx.font = '12px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'left'; ctx.fillText(`W:${stats.wins}  L:${stats.losses}  🔥${stats.streak}`, 8, H - 8);
    ctx.textAlign = 'right'; ctx.fillText(`Best streak: ${stats.bestStreak}`, W - 8, H - 8);
  }
}

function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
function bigButton(label, x, y, w, h, color, textColor = '#fff') {
  roundRect(x, y, w, h, 12, color);
  roundRect(x, y, w, h, 12, null, 'rgba(255,255,255,0.3)');
  ctx.fillStyle = textColor; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w/2, y + h/2 + 9);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: NAME ENTRY
// ═══════════════════════════════════════════════════════════════════════════════
function drawNameScreen() {
  const t = theme();
  ctx.fillStyle = t.court; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 52px Arial'; ctx.fillText(CONFIG.gameTitle, W/2, 90);
  ctx.font = '16px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(CONFIG.nonprofitName + '  ·  ' + CONFIG.poweredBy, W/2, 118);
  const asking = namingP2 ? 'Player 2 name:' : 'Your name:';
  const buf    = namingP2 ? p2Buffer : nameBuffer;
  ctx.font = 'bold 22px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(asking, W/2, 200);
  roundRect(W/2-160, 218, 320, 54, 8, 'rgba(255,255,255,0.15)', 'rgba(255,255,255,0.6)');
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial';
  ctx.fillText((buf || '_') + (Math.floor(Date.now()/500) % 2 ? '|' : ''), W/2, 254);
  ctx.font = '16px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Type your name and press Enter', W/2, 298);
  ctx.font = '14px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('(press Enter to use default)', W/2, 322);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SETUP
// ═══════════════════════════════════════════════════════════════════════════════
function drawSetupScreen() {
  const t = theme();
  ctx.fillStyle = t.court; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 34px Arial'; ctx.fillText('🏆 Tournament Setup  ·  Full Edition', W/2, 48);

  ctx.font = 'bold 17px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText('Difficulty', W/2, 84);
  Object.keys(DIFFICULTY).forEach((d, i) => {
    const bw = 150, bh = 44, gap = 18;
    const bx = W/2 - (3*bw+2*gap)/2 + i*(bw+gap), by = 92;
    const isSel = setupSelection.diff === d;
    roundRect(bx, by, bw, bh, 10, isSel ? DIFFICULTY[d].color : 'rgba(255,255,255,0.15)', isSel ? '#fff' : 'rgba(255,255,255,0.3)');
    ctx.fillStyle = '#fff'; ctx.font = isSel ? 'bold 19px Arial' : '17px Arial';
    ctx.fillText(DIFFICULTY[d].label, bx+bw/2, by+bh/2+7);
    setupBtns['diff_'+d] = { x: bx, y: by, w: bw, h: bh };
  });

  ctx.font = 'bold 17px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'center';
  ctx.fillText('Court Theme', W/2, 184);
  Object.keys(CONFIG.themes).forEach((th, i) => {
    const bw = 150, bh = 44, gap = 18;
    const bx = W/2 - (3*bw+2*gap)/2 + i*(bw+gap), by = 192;
    const isSel = setupSelection.theme === th;
    roundRect(bx, by, bw, bh, 10, isSel ? CONFIG.themes[th].court : 'rgba(255,255,255,0.12)', isSel ? '#fff' : 'rgba(255,255,255,0.25)');
    ctx.fillStyle = '#fff'; ctx.font = isSel ? 'bold 17px Arial' : '15px Arial';
    ctx.fillText(CONFIG.themes[th].name, bx+bw/2, by+bh/2+6);
    setupBtns['theme_'+th] = { x: bx, y: by, w: bw, h: bh };
  });

  ctx.font = 'bold 17px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'center';
  ctx.fillText('Ball Style', W/2, 284);
  const emojis = ['🎾', ...CONFIG.ballEmojis.slice(1), '●'];
  const bSize = 52, bGap = 12;
  const totalEW = emojis.length*bSize + (emojis.length-1)*bGap;
  emojis.forEach((e, i) => {
    const bx = W/2-totalEW/2 + i*(bSize+bGap), by = 292;
    const isSel = setupSelection.emoji === i;
    roundRect(bx, by, bSize, bSize, 10, isSel ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.1)', isSel ? '#fff' : 'rgba(255,255,255,0.2)');
    ctx.font = e === '●' ? '26px Arial' : '26px serif'; ctx.textAlign = 'center';
    ctx.fillStyle = e === '●' ? theme().ball : '#fff';
    ctx.fillText(e, bx+bSize/2, by+bSize/2+9);
    setupBtns['emoji_'+i] = { x: bx, y: by, w: bSize, h: bSize };
  });

  ctx.font = 'bold 17px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'center';
  ctx.fillText('Mode', W/2, 395);
  ['1 Player  🤖', '2 Players  👥'].forEach((label, i) => {
    const bw = 196, bh = 46, gap = 22;
    const bx = W/2-(2*bw+gap)/2 + i*(bw+gap), by = 403;
    const isSel = setupSelection.twoPlayer === (i === 1);
    roundRect(bx, by, bw, bh, 10, isSel ? '#1565c0' : 'rgba(255,255,255,0.12)', isSel ? '#fff' : 'rgba(255,255,255,0.25)');
    ctx.fillStyle = '#fff'; ctx.font = isSel ? 'bold 17px Arial' : '15px Arial';
    ctx.fillText(label, bx+bw/2, by+bh/2+7);
    setupBtns['mode_'+i] = { x: bx, y: by, w: bw, h: bh };
  });

  bigButton('▶  START', W/2-100, 462, 200, 52, '#2e7d32');
  setupBtns['start'] = { x: W/2-100, y: 462, w: 200, h: 52 };

  ctx.font = '12px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.textAlign = 'center';
  ctx.fillText('v3d: ⚡ trail  ·  progressive CPU  ·  power-ups  ·  best-of-3 sets', W/2, H - 8);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SERVE PROMPT
// ═══════════════════════════════════════════════════════════════════════════════
function drawServePrompt() {
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '18px Arial'; ctx.textAlign = 'center';
  ctx.fillText(twoPlayer
    ? `${playerName}: ↑↓ / WS    ${p2Name}: I K  —  Space to serve`
    : 'Arrow keys  ↑↓  or  W S  to move  ·  Space or tap to serve',
    W/2, H - 18);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SET END OVERLAY
// ═══════════════════════════════════════════════════════════════════════════════
function drawSetEndOverlay() {
  const lastSet = setHistory[setHistory.length - 1];
  const playerWonSet = lastSet.p > lastSet.c;
  const p2Label = twoPlayer ? p2Name : 'BOB';
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, H/2 - 90, W, 195);
  ctx.textAlign = 'center';
  ctx.fillStyle = playerWonSet ? '#ffd600' : '#ff8a65';
  ctx.font = 'bold 40px Arial';
  ctx.fillText(`${playerWonSet ? playerName : p2Label} WINS SET ${setHistory.length}!`, W/2, H/2 - 32);
  ctx.font = '22px Arial'; ctx.fillStyle = '#fff';
  ctx.fillText(`${lastSet.p} – ${lastSet.c}`, W/2, H/2 + 10);
  ctx.font = '17px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(`Match: ${playerName} ${playerSets}  ·  ${p2Label} ${cpuSets}  — next set starting…`, W/2, H/2 + 50);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: MATCH END
// ═══════════════════════════════════════════════════════════════════════════════
function drawMatchEndScreen() {
  const playerWon = playerSets >= CONFIG.setsToWin;
  const p2Label = twoPlayer ? p2Name : 'BOB';
  const winner = playerWon ? playerName : p2Label;
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 54px Arial';
  ctx.fillText((playerWon ? '🏆 ' : '🤖 ') + winner + ' WINS!', W/2, H/2 - 120);
  ctx.font = '20px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(playerWon ? 'Tournament champion! 🎾 Amazing!' : 'Great match! Try again?', W/2, H/2 - 74);
  let histY = H/2 - 42;
  setHistory.forEach((s, i) => {
    const sWon = s.p > s.c;
    ctx.font = 'bold 17px Arial'; ctx.fillStyle = sWon ? '#a5d6a7' : '#ef9a9a';
    ctx.fillText(`Set ${i+1}:  ${playerName} ${s.p}  –  ${s.c}  ${p2Label}`, W/2, histY);
    histY += 26;
  });
  ctx.font = 'bold 22px Arial'; ctx.fillStyle = '#ffd600';
  ctx.fillText(`Sets:  ${playerName} ${playerSets}  –  ${cpuSets}  ${p2Label}`, W/2, histY + 12);
  ctx.font = '15px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(`W:${stats.wins}  L:${stats.losses}  🔥${stats.streak}  Best:${stats.bestStreak}`, W/2, histY + 36);
  bigButton('▶  PLAY AGAIN', W/2-120, histY+54, 240, 50, playerWon ? '#2e7d32' : '#b71c1c');
  bigButton('⚙  SETUP', W/2-72, histY+116, 144, 42, 'rgba(255,255,255,0.2)');
}

// ═══════════════════════════════════════════════════════════════════════════════
//  MAIN DRAW
// ═══════════════════════════════════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (phase === 'name')  { drawNameScreen(); return; }
  if (phase === 'setup') { drawSetupScreen(); return; }

  drawCourt();
  drawScore();
  drawActivePowerup();
  drawPaddle(playerPad, 'player');
  drawPaddle(cpuPad,    'cpu');
  drawTrail();
  drawBall();
  drawFlashMsg();
  drawConfetti(ctx);

  if (phase === 'serve') drawServePrompt();

  if (phase === 'point') {
    const scored = lastScorer === 'player' ? playerName + ' scores! 🎾' : (twoPlayer ? p2Name : 'BOB') + ' scores!';
    const col = lastScorer === 'player' ? '#2e7d32' : '#c62828';
    ctx.fillStyle = col; ctx.globalAlpha = 0.75; ctx.fillRect(0, H/2-38, W, 66); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px Arial'; ctx.textAlign = 'center';
    ctx.fillText(scored, W/2, H/2+8);
  }

  if (phase === 'setEnd')   drawSetEndOverlay();
  if (phase === 'matchEnd') drawMatchEndScreen();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════════════════════════
function loop() { update(); draw(); requestAnimationFrame(loop); }

// ═══════════════════════════════════════════════════════════════════════════════
//  INPUT — KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (phase === 'name') {
    if (e.key === 'Enter') {
      const buf = namingP2 ? p2Buffer : nameBuffer;
      if (!namingP2) {
        playerName = buf.trim() || 'YOU';
        if (setupSelection.twoPlayer) { namingP2 = true; p2Buffer = ''; }
        else { phase = 'setup'; }
      } else { p2Name = buf.trim() || 'P2'; phase = 'setup'; }
      playClick(); return;
    }
    if (e.key === 'Backspace') {
      if (namingP2) p2Buffer = p2Buffer.slice(0, -1); else nameBuffer = nameBuffer.slice(0, -1); return;
    }
    if (e.key.length === 1 && /[a-zA-Z0-9 ]/.test(e.key)) {
      if (!namingP2 && nameBuffer.length < 10) nameBuffer += e.key;
      if (namingP2  && p2Buffer.length  < 10) p2Buffer  += e.key;
    }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleAction(); }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function handleAction() {
  if (phase === 'serve')    { phase = 'play'; playClick(); }
  if (phase === 'matchEnd') { startMatch(); }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  INPUT — MOUSE / TOUCH
// ═══════════════════════════════════════════════════════════════════════════════
function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * W / rect.width, y: (src.clientY - rect.top) * H / rect.height };
}
function hitBtn(pt, btn) {
  return pt.x >= btn.x && pt.x <= btn.x+btn.w && pt.y >= btn.y && pt.y <= btn.y+btn.h;
}
function handleClick(pt) {
  playClick();
  if (phase === 'setup') {
    for (const [key, btn] of Object.entries(setupBtns)) {
      if (!hitBtn(pt, btn)) continue;
      if (key.startsWith('diff_'))  { setupSelection.diff  = key.slice(5); }
      if (key.startsWith('theme_')) { setupSelection.theme = key.slice(6); currentTheme = key.slice(6); }
      if (key.startsWith('emoji_')) { setupSelection.emoji = parseInt(key.slice(6)); }
      if (key.startsWith('mode_'))  { setupSelection.twoPlayer = key === 'mode_1'; }
      if (key === 'start') {
        currentDiff = setupSelection.diff; currentTheme = setupSelection.theme; twoPlayer = setupSelection.twoPlayer;
        const emojis = ['🎾', ...CONFIG.ballEmojis.slice(1), null];
        currentBallEmoji = emojis[setupSelection.emoji] === '●' ? null : emojis[setupSelection.emoji];
        if (twoPlayer && p2Name === 'P2') { namingP2 = true; p2Buffer = ''; phase = 'name'; }
        else { startMatch(); }
      }
    }
    return;
  }
  if (phase === 'serve') { phase = 'play'; return; }
  if (phase === 'matchEnd') {
    const histY = H/2 - 42 + setHistory.length * 26;
    if (hitBtn(pt, { x: W/2-120, y: histY+54,  w: 240, h: 50 })) { startMatch(); return; }
    if (hitBtn(pt, { x: W/2-72,  y: histY+116, w: 144, h: 42 })) { namingP2 = false; phase = 'name'; return; }
    startMatch();
  }
}
function movePaddle(pt) {
  if (phase !== 'play' && phase !== 'serve') return;
  if (pt.x < W/2) playerPad.y = Math.max(0, Math.min(H - effectivePaddleH('player'), pt.y - PADDLE_H/2));
  else if (twoPlayer) cpuPad.y = Math.max(0, Math.min(H - effectivePaddleH('cpu'), pt.y - PADDLE_H/2));
}
canvas.addEventListener('click', e => { handleClick(canvasPoint(e)); });
canvas.addEventListener('mousemove', e => { movePaddle(canvasPoint(e)); });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  Array.from(e.touches).forEach(t => movePaddle(canvasPoint({ clientX: t.clientX, clientY: t.clientY })));
}, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleClick(canvasPoint(e)); }, { passive: false });

document.getElementById('muteBtn').addEventListener('click', e => {
  e.stopPropagation(); muted = !muted; e.target.textContent = muted ? '🔇' : '🔊';
});

// ═══════════════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════════════
resetSpawnCountdown();
resetPaddles();
resetBall('player');
loop();
</script>
</body>
