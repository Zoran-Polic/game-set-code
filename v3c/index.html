<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎾 TENNIS! — IBM Bob Edition v3c</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a6b2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      max-width: 100vw;
      max-height: 95vh;
    }

    #muteBtn {
      position: fixed;
      top: 12px;
      right: 16px;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      border-radius: 8px;
      color: #fff;
      font-size: 22px;
      padding: 8px 14px;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      min-width: 48px;
      min-height: 48px;
    }
    #muteBtn:hover { background: rgba(255,255,255,0.35); }
  </style>
</head>
<body>

<button id="muteBtn" title="Toggle sound">🔊</button>
<canvas id="gameCanvas" width="800" height="560"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
//  CONFIGURATION — customise for your event / nonprofit
// ═══════════════════════════════════════════════════════════════════════════════
const CONFIG = {
  nonprofitName:  'IBM Community',
  gameTitle:      '🎾 TENNIS!',
  poweredBy:      'Powered by IBM Bob',
  scoreToWin:     5,   // points to win a set
  setsToWin:      2,   // sets needed to win the match (best of 3 → 2)
  themes: {
    classic: {
      court: '#3a8a40', courtAlt: '#2e7333', sky: '#87ceeb',
      playerPad: '#2979ff', cpuPad: '#ff6d00',
      ball: '#f9e44a', ballInner: '#fff176',
      name: 'Classic'
    },
    night: {
      court: '#1a237e', courtAlt: '#283593', sky: '#0d0d2b',
      playerPad: '#00e5ff', cpuPad: '#ff4081',
      ball: '#ffffff', ballInner: '#e0e0e0',
      name: 'Night'
    },
    clay: {
      court: '#b5451b', courtAlt: '#9c3d18', sky: '#ffa040',
      playerPad: '#ffd600', cpuPad: '#7c4dff',
      ball: '#ffffff', ballInner: '#f5f5f5',
      name: 'Clay'
    },
  },
  ballEmojis: ['🎾', '⚽', '🏀', '🌟', '❤️'],
};

const DIFFICULTY = {
  easy:   { cpuSpeed: 2.4, missFactor: 0.70, label: 'Easy',   color: '#43a047' },
  medium: { cpuSpeed: 3.2, missFactor: 0.82, label: 'Medium', color: '#fb8c00' },
  hard:   { cpuSpeed: 4.8, missFactor: 0.93, label: 'Hard',   color: '#e53935' },
};

// ═══════════════════════════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════════
const W = 800, H = 560;
const PADDLE_W = 14, PADDLE_H = 90;
const BALL_R = 11;
const PLAYER_X = 30, CPU_X = W - 30 - PADDLE_W;
const BALL_SPEED_INIT = 5;
const BALL_SPEED_MAX  = 12;
const BALL_SPEED_INC  = 0.35;
const PLAYER_SPEED    = 7;

// ═══════════════════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════════════════
let phase = 'name';  // name | setup | serve | play | point | setEnd | matchEnd
let twoPlayer        = false;
let currentDiff      = 'easy';
let currentTheme     = 'classic';
let currentBallEmoji = null;
let playerName       = 'YOU';
let p2Name           = 'P2';

// Per-point
let playerScore = 0, cpuScore = 0;
let lastScorer  = null;
let pointDelay  = 0;
let ball, playerPad, cpuPad;
let ballSpeedMult = 1;

// v3c: tournament / set tracking
let playerSets  = 0, cpuSets = 0;   // sets won
let setHistory  = [];                // [{p, c}, ...] — scores of completed sets
let setEndDelay = 0;

let keys       = {};
let muted      = false;
let audioCtx   = null;

const setupBtns = {};
let setupSelection = { diff: 'easy', theme: 'classic', emoji: 0, twoPlayer: false };

let stats = { wins: 0, losses: 0, streak: 0, bestStreak: 0 };
try {
  const saved = JSON.parse(localStorage.getItem('ibmTennisStats') || '{}');
  Object.assign(stats, saved);
} catch(e) {}
function saveStats() {
  try { localStorage.setItem('ibmTennisStats', JSON.stringify(stats)); } catch(e) {}
}

let nameBuffer   = '';
let p2Buffer     = '';
let namingP2     = false;

let confetti = [];

// ═══════════════════════════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════════════════════════
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.15) {
  if (muted) return;
  try {
    const ctx = getAudio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playPock()    { beep(500, 0.07); }
function playWall()    { beep(300, 0.04); }
function playCheer()   { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, 'sine', 0.14), i*120)); }
function playSetWin()  { [523,659,784,880,1047,784].forEach((f,i) => setTimeout(() => beep(f, 0.18, 'sine', 0.16), i*100)); }
function playWin()     { [523,659,784,659,1047,784,1047,1319].forEach((f,i) => setTimeout(() => beep(f, 0.22, 'sine', 0.18), i*130)); }
function playClick()   { beep(880, 0.04, 'sine', 0.08); }

// ═══════════════════════════════════════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════════════════════════════════════
function spawnConfetti(count = 80) {
  const colors = ['#f9e44a','#2979ff','#ff6d00','#43a047','#e53935','#ffffff','#7c4dff'];
  for (let i = 0; i < count; i++) {
    confetti.push({
      x: Math.random() * W, y: -10,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 4 + 2,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2,
      life: 1,
    });
  }
}
function updateConfetti() {
  confetti = confetti.filter(c => c.life > 0);
  confetti.forEach(c => {
    c.x += c.vx; c.y += c.vy; c.rot += c.rotV;
    c.vy += 0.1; c.life -= 0.008;
  });
}
function drawConfetti(ctx) {
  confetti.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = c.life;
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/4, c.size, c.size/2);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════════════════════════════════
function resetBall(server = 'player') {
  const angle = (Math.random() * 40 - 20) * Math.PI / 180;
  const dir = server === 'player' ? 1 : -1;
  ball = {
    x: W / 2, y: H / 2,
    vx: dir * BALL_SPEED_INIT * Math.cos(angle),
    vy: BALL_SPEED_INIT * Math.sin(angle),
  };
  ballSpeedMult = 1;
}
function resetPaddles() {
  playerPad = { x: PLAYER_X, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
  cpuPad    = { x: CPU_X,    y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
}
function startSet() {
  playerScore = 0; cpuScore = 0;
  confetti = [];
  resetPaddles();
  resetBall('player');
  phase = 'serve';
}
function startMatch() {
  playerSets = 0; cpuSets = 0;
  setHistory = [];
  startSet();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════════════════════════
function updatePlay() {
  const diff = DIFFICULTY[currentDiff];

  if ((keys['ArrowUp']   || keys['w'] || keys['W']) && playerPad.y > 0)
    playerPad.y -= PLAYER_SPEED;
  if ((keys['ArrowDown'] || keys['s'] || keys['S']) && playerPad.y < H - PADDLE_H)
    playerPad.y += PLAYER_SPEED;

  if (twoPlayer) {
    if ((keys['i'] || keys['I']) && cpuPad.y > 0)             cpuPad.y -= PLAYER_SPEED;
    if ((keys['k'] || keys['K']) && cpuPad.y < H - PADDLE_H)  cpuPad.y += PLAYER_SPEED;
  } else {
    const center = cpuPad.y + PADDLE_H / 2;
    const target = ball.y * diff.missFactor + (H / 2) * (1 - diff.missFactor);
    if (center < target - 5 && cpuPad.y < H - PADDLE_H) cpuPad.y += diff.cpuSpeed;
    else if (center > target + 5 && cpuPad.y > 0)        cpuPad.y -= diff.cpuSpeed;
  }

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y - BALL_R <= 0)  { ball.y = BALL_R;        ball.vy =  Math.abs(ball.vy); playWall(); }
  if (ball.y + BALL_R >= H)  { ball.y = H - BALL_R;    ball.vy = -Math.abs(ball.vy); playWall(); }

  function paddleHit(pad, newVxSign) {
    const hitPos = (ball.y - pad.y) / PADDLE_H - 0.5;
    ball.vx = newVxSign * Math.abs(ball.vx);
    ball.vy = hitPos * 9;
    ballSpeedMult = Math.min(ballSpeedMult + BALL_SPEED_INC / BALL_SPEED_INIT, BALL_SPEED_MAX / BALL_SPEED_INIT);
    ball.vx *= ballSpeedMult;
    ball.vy *= ballSpeedMult;
    playPock();
  }

  if (ball.vx < 0 &&
      ball.x - BALL_R <= playerPad.x + playerPad.w &&
      ball.x - BALL_R >= playerPad.x - 4 &&
      ball.y + BALL_R >= playerPad.y &&
      ball.y - BALL_R <= playerPad.y + PADDLE_H) {
    paddleHit(playerPad, 1);
    ball.x = playerPad.x + playerPad.w + BALL_R;
  }

  if (ball.vx > 0 &&
      ball.x + BALL_R >= cpuPad.x &&
      ball.x + BALL_R <= cpuPad.x + cpuPad.w + 4 &&
      ball.y + BALL_R >= cpuPad.y &&
      ball.y - BALL_R <= cpuPad.y + PADDLE_H) {
    paddleHit(cpuPad, -1);
    ball.x = cpuPad.x - BALL_R;
  }

  if (ball.x + BALL_R < 0)  { cpuScore++;    lastScorer = 'cpu';    playCheer(); endPoint(); }
  if (ball.x - BALL_R > W)  { playerScore++; lastScorer = 'player'; playCheer(); endPoint(); }
}

function endPoint() {
  if (playerScore >= CONFIG.scoreToWin || cpuScore >= CONFIG.scoreToWin) {
    // Set over
    setHistory.push({ p: playerScore, c: cpuScore });
    const playerWonSet = playerScore >= CONFIG.scoreToWin;
    if (playerWonSet) playerSets++; else cpuSets++;
    playSetWin();
    spawnConfetti(50);

    if (playerSets >= CONFIG.setsToWin || cpuSets >= CONFIG.setsToWin) {
      // Match over
      const playerWon = playerSets >= CONFIG.setsToWin;
      if (playerWon) { stats.wins++; stats.streak++; stats.bestStreak = Math.max(stats.streak, stats.bestStreak); }
      else           { stats.losses++; stats.streak = 0; }
      saveStats();
      spawnConfetti(80);
      playWin();
      phase = 'matchEnd';
    } else {
      phase = 'setEnd';
      setEndDelay = 180;  // ~3 seconds
    }
  } else {
    phase = 'point';
    pointDelay = 80;
  }
}

function update() {
  if (phase === 'play')  { updatePlay(); updateConfetti(); }
  if (phase === 'matchEnd') { updateConfetti(); }
  if (phase === 'point') {
    pointDelay--;
    if (pointDelay <= 0) {
      resetPaddles();
      resetBall(lastScorer === 'cpu' ? 'cpu' : 'player');
      phase = 'serve';
    }
  }
  if (phase === 'setEnd') {
    updateConfetti();
    setEndDelay--;
    if (setEndDelay <= 0) {
      startSet();
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function theme() { return CONFIG.themes[currentTheme]; }

function drawCourt() {
  const t = theme();
  const sky = ctx.createLinearGradient(0, 0, 0, 70);
  sky.addColorStop(0, t.sky); sky.addColorStop(1, t.court);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 70);
  ctx.fillStyle = t.court; ctx.fillRect(0, 70, W, H - 70);
  ctx.fillStyle = t.courtAlt;
  ctx.fillRect(W*0.25, H*0.15, W*0.25, H*0.7);
  ctx.fillRect(W*0.5,  H*0.15, W*0.25, H*0.7);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
  ctx.setLineDash([12, 8]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
  [[W*0.25,H*0.15,W*0.75,H*0.15],[W*0.25,H*0.85,W*0.75,H*0.85],
   [W*0.25,H*0.15,W*0.25,H*0.85],[W*0.75,H*0.15,W*0.75,H*0.85]].forEach(([x1,y1,x2,y2]) => {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
}

function drawPaddle(pad, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(pad.x, pad.y, pad.w, pad.h, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.roundRect(pad.x+2, pad.y+4, pad.w-4, pad.h/3, 4); ctx.fill();
}

function drawBall() {
  const t = theme();
  if (currentBallEmoji) {
    ctx.font = `${BALL_R * 2.2}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(currentBallEmoji, ball.x, ball.y);
    ctx.textBaseline = 'alphabetic';
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(ball.x+3, ball.y+3, BALL_R, BALL_R*0.7, 0, 0, Math.PI*2); ctx.fill();
    const g = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, BALL_R);
    g.addColorStop(0, t.ballInner); g.addColorStop(1, t.ball);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(150,100,0,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*0.7, 0.3, Math.PI+0.3); ctx.stroke();
  }
}

// v3c: draw set scoreboard (dot-style in top strip)
function drawScore() {
  const p2Label = twoPlayer ? p2Name : 'BOB';
  ctx.textAlign = 'center';

  // Point score
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px Arial';
  ctx.fillText(playerScore, W/2 - 75, 50);
  ctx.fillText(cpuScore,    W/2 + 75, 50);
  ctx.font = 'bold 26px Arial';
  ctx.fillText('—', W/2, 50);
  ctx.font = '13px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(playerName.toUpperCase().slice(0,8), W/2 - 75, 64);
  ctx.fillText(p2Label.toUpperCase().slice(0,8),     W/2 + 75, 64);

  // v3c: set dots
  const maxSets = CONFIG.setsToWin * 2 - 1;  // e.g. 3
  const dotR = 7, dotGap = 18;
  const totalDotW = maxSets * dotR * 2 + (maxSets - 1) * dotGap;

  // Player sets (left of divider)
  for (let i = 0; i < maxSets; i++) {
    const bx = W/2 - totalDotW/2 + i * (dotR*2 + dotGap) + dotR;
    // player set dots — top row
    ctx.beginPath();
    ctx.arc(bx - 40, 78, dotR, 0, Math.PI*2);
    ctx.fillStyle = i < playerSets ? '#ffd600' : 'rgba(255,255,255,0.25)';
    ctx.fill();
  }
  // CPU sets (right)
  for (let i = 0; i < maxSets; i++) {
    const bx = W/2 - totalDotW/2 + i * (dotR*2 + dotGap) + dotR;
    ctx.beginPath();
    ctx.arc(bx + 40, 78, dotR, 0, Math.PI*2);
    ctx.fillStyle = i < cpuSets ? '#ffd600' : 'rgba(255,255,255,0.25)';
    ctx.fill();
  }

  // Set label
  const currentSet = playerSets + cpuSets + 1;
  ctx.font = '11px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign = 'center';
  ctx.fillText(`SET ${currentSet}`, W/2, 81);

  // Historical set scores
  if (setHistory.length > 0) {
    ctx.font = '11px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    let histText = 'Sets: ';
    setHistory.forEach(s => { histText += `${s.p}-${s.c}  `; });
    ctx.fillText(histText.trim(), W/2, H - 8);
  } else {
    ctx.font = '12px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'left';
    ctx.fillText(`W:${stats.wins}  L:${stats.losses}  🔥${stats.streak}`, 8, H - 8);
    ctx.textAlign = 'right';
    ctx.fillText(`Best streak: ${stats.bestStreak}`, W - 8, H - 8);
  }
}

function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill)   { ctx.fillStyle = fill;   ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function bigButton(label, x, y, w, h, color, textColor = '#fff') {
  roundRect(x, y, w, h, 12, color);
  roundRect(x, y, w, h, 12, null, 'rgba(255,255,255,0.3)');
  ctx.fillStyle = textColor;
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w/2, y + h/2 + 9);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: NAME ENTRY
// ═══════════════════════════════════════════════════════════════════════════════
function drawNameScreen() {
  const t = theme();
  ctx.fillStyle = t.court; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 52px Arial'; ctx.fillText(CONFIG.gameTitle, W/2, 90);
  ctx.font = '16px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(CONFIG.nonprofitName + '  ·  ' + CONFIG.poweredBy, W/2, 118);
  const asking = namingP2 ? 'Player 2 name:' : 'Your name:';
  const buf    = namingP2 ? p2Buffer : nameBuffer;
  ctx.font = 'bold 22px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(asking, W/2, 200);
  roundRect(W/2-160, 218, 320, 54, 8, 'rgba(255,255,255,0.15)', 'rgba(255,255,255,0.6)');
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial';
  ctx.fillText((buf || '_') + (Math.floor(Date.now()/500) % 2 ? '|' : ''), W/2, 254);
  ctx.font = '16px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Type your name and press Enter', W/2, 298);
  ctx.font = '14px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('(press Enter to use default)', W/2, 322);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SETUP
// ═══════════════════════════════════════════════════════════════════════════════
function drawSetupScreen() {
  const t = theme();
  ctx.fillStyle = t.court; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px Arial';
  ctx.fillText('Tournament Setup  🏆', W/2, 52);

  ctx.font = 'bold 18px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Difficulty', W/2, 88);
  const diffs = Object.keys(DIFFICULTY);
  diffs.forEach((d, i) => {
    const bw = 150, bh = 46, gap = 20;
    const bx = W/2 - (diffs.length * bw + (diffs.length-1)*gap)/2 + i*(bw+gap);
    const by = 96;
    const isSel = setupSelection.diff === d;
    roundRect(bx, by, bw, bh, 10, isSel ? DIFFICULTY[d].color : 'rgba(255,255,255,0.15)', isSel ? '#fff' : 'rgba(255,255,255,0.3)');
    ctx.fillStyle = '#fff'; ctx.font = isSel ? 'bold 20px Arial' : '18px Arial';
    ctx.fillText(DIFFICULTY[d].label, bx+bw/2, by+bh/2+7);
    setupBtns['diff_'+d] = { x: bx, y: by, w: bw, h: bh };
  });

  ctx.font = 'bold 18px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'center';
  ctx.fillText('Court Theme', W/2, 190);
  const themes = Object.keys(CONFIG.themes);
  themes.forEach((th, i) => {
    const bw = 150, bh = 46, gap = 20;
    const bx = W/2 - (themes.length*bw+(themes.length-1)*gap)/2 + i*(bw+gap);
    const by = 198;
    const isSel = setupSelection.theme === th;
    roundRect(bx, by, bw, bh, 10, isSel ? CONFIG.themes[th].court : 'rgba(255,255,255,0.12)', isSel ? '#fff' : 'rgba(255,255,255,0.25)');
    ctx.fillStyle = '#fff'; ctx.font = isSel ? 'bold 18px Arial' : '16px Arial';
    ctx.fillText(CONFIG.themes[th].name, bx+bw/2, by+bh/2+6);
    setupBtns['theme_'+th] = { x: bx, y: by, w: bw, h: bh };
  });

  ctx.font = 'bold 18px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'center';
  ctx.fillText('Ball Style', W/2, 296);
  const emojis = ['🎾', ...CONFIG.ballEmojis.slice(1), '●'];
  const bSize = 54, bGap = 14;
  const totalEW = emojis.length*bSize + (emojis.length-1)*bGap;
  emojis.forEach((e, i) => {
    const bx = W/2-totalEW/2 + i*(bSize+bGap);
    const by = 304;
    const isSel = setupSelection.emoji === i;
    roundRect(bx, by, bSize, bSize, 10, isSel ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.1)', isSel ? '#fff' : 'rgba(255,255,255,0.2)');
    ctx.font = e === '●' ? '28px Arial' : '28px serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = e === '●' ? theme().ball : '#fff';
    ctx.fillText(e, bx+bSize/2, by+bSize/2+10);
    setupBtns['emoji_'+i] = { x: bx, y: by, w: bSize, h: bSize };
  });

  ctx.font = 'bold 18px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.textAlign = 'center';
  ctx.fillText('Mode', W/2, 408);
  ['1 Player  🤖', '2 Players  👥'].forEach((label, i) => {
    const bw = 200, bh = 48, gap = 24;
    const bx = W/2-(2*bw+gap)/2 + i*(bw+gap);
    const by = 416;
    const isSel = setupSelection.twoPlayer === (i === 1);
    roundRect(bx, by, bw, bh, 10, isSel ? '#1565c0' : 'rgba(255,255,255,0.12)', isSel ? '#fff' : 'rgba(255,255,255,0.25)');
    ctx.fillStyle = '#fff'; ctx.font = isSel ? 'bold 18px Arial' : '16px Arial';
    ctx.fillText(label, bx+bw/2, by+bh/2+7);
    setupBtns['mode_'+i] = { x: bx, y: by, w: bw, h: bh };
  });

  bigButton('▶  START TOURNAMENT', W/2-140, 488, 280, 54, '#2e7d32');
  setupBtns['start'] = { x: W/2-140, y: 488, w: 280, h: 54 };

  ctx.font = '13px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.textAlign = 'center';
  ctx.fillText(`v3c: Best of ${CONFIG.setsToWin*2-1} sets tournament  ·  first to ${CONFIG.scoreToWin} wins a set`, W/2, H - 8);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SERVE PROMPT
// ═══════════════════════════════════════════════════════════════════════════════
function drawServePrompt() {
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '18px Arial'; ctx.textAlign = 'center';
  ctx.fillText(twoPlayer
    ? `${playerName}: ↑↓ / WS    ${p2Name}: I K  —  Space to serve`
    : 'Arrow keys  ↑↓  or  W S  to move  ·  Space or tap to serve',
    W/2, H - 18);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SET END OVERLAY
// ═══════════════════════════════════════════════════════════════════════════════
function drawSetEndOverlay() {
  const lastSet = setHistory[setHistory.length - 1];
  const playerWonSet = lastSet.p > lastSet.c;
  const p2Label = twoPlayer ? p2Name : 'BOB';
  const setWinner = playerWonSet ? playerName : p2Label;

  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, H/2 - 80, W, 180);

  ctx.textAlign = 'center';
  ctx.fillStyle = playerWonSet ? '#ffd600' : '#ff8a65';
  ctx.font = 'bold 42px Arial';
  ctx.fillText(`${setWinner} WINS SET ${setHistory.length}!`, W/2, H/2 - 24);

  ctx.font = '22px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(`${lastSet.p} – ${lastSet.c}`, W/2, H/2 + 18);

  // Sets total
  ctx.font = '18px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(`Match: ${playerName} ${playerSets}  ·  ${p2Label} ${cpuSets}  — next set starting…`, W/2, H/2 + 54);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: MATCH END
// ═══════════════════════════════════════════════════════════════════════════════
function drawMatchEndScreen() {
  const playerWon = playerSets >= CONFIG.setsToWin;
  const p2Label = twoPlayer ? p2Name : 'BOB';
  const winner = playerWon ? playerName : p2Label;

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 58px Arial';
  ctx.fillText((playerWon ? '🏆 ' : '🤖 ') + winner + ' WINS!', W/2, H/2 - 110);

  ctx.font = '20px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(playerWon ? 'Tournament champion! Amazing!' : 'Great match! Try again?', W/2, H/2 - 62);

  // Set score history
  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  let histY = H/2 - 28;
  setHistory.forEach((s, i) => {
    const sWon = s.p > s.c;
    ctx.fillStyle = sWon ? '#a5d6a7' : '#ef9a9a';
    ctx.fillText(`Set ${i+1}:  ${playerName} ${s.p}  –  ${s.c}  ${p2Label}`, W/2, histY);
    histY += 28;
  });

  // Final sets
  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = '#ffd600';
  ctx.fillText(`Sets:  ${playerName} ${playerSets}  –  ${cpuSets}  ${p2Label}`, W/2, histY + 12);

  ctx.font = '16px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(`Wins: ${stats.wins}  ·  Losses: ${stats.losses}  ·  Best streak: ${stats.bestStreak}`, W/2, histY + 40);

  bigButton('▶  PLAY AGAIN', W/2-120, histY + 60, 240, 52, playerWon ? '#2e7d32' : '#b71c1c');
  bigButton('⚙  SETUP', W/2-75, histY + 126, 150, 44, 'rgba(255,255,255,0.2)');
}

// ═══════════════════════════════════════════════════════════════════════════════
//  MAIN DRAW
// ═══════════════════════════════════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0, 0, W, H);

  if (phase === 'name')  { drawNameScreen(); return; }
  if (phase === 'setup') { drawSetupScreen(); return; }

  drawCourt();
  drawScore();
  drawPaddle(playerPad, theme().playerPad);
  drawPaddle(cpuPad,    theme().cpuPad);
  drawBall();
  drawConfetti(ctx);

  if (phase === 'serve') drawServePrompt();

  if (phase === 'point') {
    const scored = lastScorer === 'player' ? playerName + ' scores! 🎾' : (twoPlayer ? p2Name : 'BOB') + ' scores!';
    const col = lastScorer === 'player' ? '#2e7d32' : '#c62828';
    ctx.fillStyle = col; ctx.globalAlpha = 0.75;
    ctx.fillRect(0, H/2 - 38, W, 66);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px Arial'; ctx.textAlign = 'center';
    ctx.fillText(scored, W/2, H/2 + 8);
  }

  if (phase === 'setEnd')   drawSetEndOverlay();
  if (phase === 'matchEnd') drawMatchEndScreen();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════════════════════════
function loop() { update(); draw(); requestAnimationFrame(loop); }

// ═══════════════════════════════════════════════════════════════════════════════
//  INPUT — KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  keys[e.key] = true;

  if (phase === 'name') {
    if (e.key === 'Enter') {
      const buf = namingP2 ? p2Buffer : nameBuffer;
      if (!namingP2) {
        playerName = buf.trim() || 'YOU';
        if (setupSelection.twoPlayer) { namingP2 = true; p2Buffer = ''; }
        else { phase = 'setup'; }
      } else {
        p2Name = buf.trim() || 'P2';
        phase = 'setup';
      }
      playClick(); return;
    }
    if (e.key === 'Backspace') {
      if (namingP2) p2Buffer = p2Buffer.slice(0, -1);
      else          nameBuffer = nameBuffer.slice(0, -1);
      return;
    }
    if (e.key.length === 1 && /[a-zA-Z0-9 ]/.test(e.key)) {
      const limit = 10;
      if (!namingP2 && nameBuffer.length < limit) nameBuffer += e.key;
      if (namingP2  && p2Buffer.length  < limit) p2Buffer  += e.key;
    }
    return;
  }

  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleAction(); }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function handleAction() {
  if (phase === 'serve')    { phase = 'play'; playClick(); }
  if (phase === 'matchEnd') { startMatch(); }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  INPUT — MOUSE / TOUCH
// ═══════════════════════════════════════════════════════════════════════════════
function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
}
function hitBtn(pt, btn) {
  return pt.x >= btn.x && pt.x <= btn.x+btn.w && pt.y >= btn.y && pt.y <= btn.y+btn.h;
}
function handleClick(pt) {
  playClick();
  if (phase === 'setup') {
    for (const [key, btn] of Object.entries(setupBtns)) {
      if (!hitBtn(pt, btn)) continue;
      if (key.startsWith('diff_'))  { setupSelection.diff  = key.slice(5); }
      if (key.startsWith('theme_')) { setupSelection.theme = key.slice(6); currentTheme = key.slice(6); }
      if (key.startsWith('emoji_')) { setupSelection.emoji = parseInt(key.slice(6)); }
      if (key.startsWith('mode_'))  { setupSelection.twoPlayer = key === 'mode_1'; }
      if (key === 'start') {
        currentDiff     = setupSelection.diff;
        currentTheme    = setupSelection.theme;
        twoPlayer       = setupSelection.twoPlayer;
        const emojis = ['🎾', ...CONFIG.ballEmojis.slice(1), null];
        currentBallEmoji = emojis[setupSelection.emoji] === '●' ? null : emojis[setupSelection.emoji];
        if (twoPlayer && p2Name === 'P2') { namingP2 = true; p2Buffer = ''; phase = 'name'; }
        else { startMatch(); }
      }
    }
    return;
  }
  if (phase === 'serve') { phase = 'play'; return; }
  if (phase === 'matchEnd') {
    // compute button positions dynamically based on setHistory length
    const histY = H/2 - 28 + setHistory.length * 28;
    const playBtn  = { x: W/2-120, y: histY+60,  w: 240, h: 52 };
    const setupBtn = { x: W/2-75,  y: histY+126, w: 150, h: 44 };
    if (hitBtn(pt, playBtn))  { startMatch(); return; }
    if (hitBtn(pt, setupBtn)) { namingP2 = false; phase = 'name'; return; }
    startMatch();
  }
}
function movePaddle(pt) {
  if (phase !== 'play' && phase !== 'serve') return;
  if (pt.x < W / 2) playerPad.y = Math.max(0, Math.min(H - PADDLE_H, pt.y - PADDLE_H/2));
  else if (twoPlayer) cpuPad.y   = Math.max(0, Math.min(H - PADDLE_H, pt.y - PADDLE_H/2));
}
canvas.addEventListener('click', e => { handleClick(canvasPoint(e)); });
canvas.addEventListener('mousemove', e => { movePaddle(canvasPoint(e)); });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  Array.from(e.touches).forEach(t => movePaddle(canvasPoint({ clientX: t.clientX, clientY: t.clientY })));
}, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleClick(canvasPoint(e)); }, { passive: false });

document.getElementById('muteBtn').addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  e.target.textContent = muted ? '🔇' : '🔊';
});

// ═══════════════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════════════
resetPaddles();
resetBall('player');
loop();
</script>
</body>
</html>
