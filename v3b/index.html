<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎾 TENNIS! — IBM Bob Edition v3b</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a6b2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      max-width: 100vw;
      max-height: 95vh;
    }

    #muteBtn {
      position: fixed;
      top: 12px;
      right: 16px;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      border-radius: 8px;
      color: #fff;
      font-size: 22px;
      padding: 8px 14px;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      min-width: 48px;
      min-height: 48px;
    }
    #muteBtn:hover { background: rgba(255,255,255,0.35); }
  </style>
</head>
<body>

<button id="muteBtn" title="Toggle sound">🔊</button>
<canvas id="gameCanvas" width="800" height="560"></canvas>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
//  CONFIGURATION — customise for your event / nonprofit
// ═══════════════════════════════════════════════════════════════════════════════
const CONFIG = {
  nonprofitName:  'IBM Community',
  gameTitle:      '🎾 TENNIS!',
  poweredBy:      'Powered by IBM Bob',
  scoreToWin:     5,
  themes: {
    classic: {
      court: '#3a8a40', courtAlt: '#2e7333', sky: '#87ceeb',
      playerPad: '#2979ff', cpuPad: '#ff6d00',
      ball: '#f9e44a', ballInner: '#fff176',
      name: 'Classic'
    },
    night: {
      court: '#1a237e', courtAlt: '#283593', sky: '#0d0d2b',
      playerPad: '#00e5ff', cpuPad: '#ff4081',
      ball: '#ffffff', ballInner: '#e0e0e0',
      name: 'Night'
    },
    clay: {
      court: '#b5451b', courtAlt: '#9c3d18', sky: '#ffa040',
      playerPad: '#ffd600', cpuPad: '#7c4dff',
      ball: '#ffffff', ballInner: '#f5f5f5',
      name: 'Clay'
    },
  },
  ballEmojis: ['🎾', '⚽', '🏀', '🌟', '❤️'],
};

const DIFFICULTY = {
  easy:   { cpuSpeed: 2.4, missFactor: 0.70, label: 'Easy',   color: '#43a047' },
  medium: { cpuSpeed: 3.2, missFactor: 0.82, label: 'Medium', color: '#fb8c00' },
  hard:   { cpuSpeed: 4.8, missFactor: 0.93, label: 'Hard',   color: '#e53935' },
};

// ═══════════════════════════════════════════════════════════════════════════════
//  v3b POWER-UP SETTINGS
// ═══════════════════════════════════════════════════════════════════════════════
// Types: 'speed' ⚡  'grow' 🛡️  'aim' 🎯
const POWERUP_TYPES = [
  { id: 'speed', emoji: '⚡', label: 'SPEED BOOST!',  color: '#ffeb3b', duration: 300 },
  { id: 'grow',  emoji: '🛡️', label: 'BIG PADDLE!',   color: '#4fc3f7', duration: 350 },
  { id: 'aim',   emoji: '🎯', label: 'AIM ASSIST!',   color: '#ce93d8', duration: 280 },
];
const POWERUP_SPAWN_MIN  = 180;  // frames between spawns (min)
const POWERUP_SPAWN_MAX  = 360;  // frames between spawns (max)
const POWERUP_RADIUS     = 18;
const GROW_BONUS         = 36;   // extra paddle height when grow is active
const SPEED_MULT         = 1.6;  // ball speed multiplier for speed boost
const AIM_REDUCTION      = 0.55; // missFactor multiplier — CPU less accurate, player aim better

// ═══════════════════════════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════════
const W = 800, H = 560;
const PADDLE_W = 14, PADDLE_H = 90;
const BALL_R = 11;
const PLAYER_X = 30, CPU_X = W - 30 - PADDLE_W;
const BALL_SPEED_INIT = 5;
const BALL_SPEED_MAX  = 12;
const BALL_SPEED_INC  = 0.35;
const PLAYER_SPEED    = 7;

// ═══════════════════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════════════════
let phase = 'name';
let twoPlayer       = false;
let currentDiff     = 'easy';
let currentTheme    = 'classic';
let currentBallEmoji = null;
let playerName      = 'YOU';
let p2Name          = 'P2';

let playerScore = 0, cpuScore = 0;
let lastScorer  = null;
let pointDelay  = 0;
let ball, playerPad, cpuPad;
let ballSpeedMult = 1;

// v3b: power-up state
let activePowerup  = null;   // { x, y, type } — on-court item waiting to be collected
let playerEffect   = null;   // { id, framesLeft } — active effect on player
let cpuEffect      = null;   // { id, framesLeft } — active effect on CPU
let spawnCountdown = 0;      // frames until next power-up spawns

// v3b: flash message for power-up pickup
let flashMsg = null;  // { text, color, life (0-1) }

let keys       = {};
let muted      = false;
let audioCtx   = null;

const setupBtns = {};
let setupSelection = { diff: 'easy', theme: 'classic', emoji: 0, twoPlayer: false };

let stats = { wins: 0, losses: 0, streak: 0, bestStreak: 0 };
try {
  const saved = JSON.parse(localStorage.getItem('ibmTennisStats') || '{}');
  Object.assign(stats, saved);
} catch(e) {}
function saveStats() {
  try { localStorage.setItem('ibmTennisStats', JSON.stringify(stats)); } catch(e) {}
}

let nameBuffer   = '';
let p2Buffer     = '';
let namingP2     = false;

let confetti = [];

// ═══════════════════════════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════════════════════════
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.15) {
  if (muted) return;
  try {
    const ctx = getAudio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playPock()    { beep(500, 0.07); }
function playWall()    { beep(300, 0.04); }
function playCheer()   { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, 'sine', 0.14), i*120)); }
function playWin()     { [523,659,784,659,1047,784].forEach((f,i) => setTimeout(() => beep(f, 0.22, 'sine', 0.18), i*150)); }
function playClick()   { beep(880, 0.04, 'sine', 0.08); }
function playPowerup() { [660, 880, 1320].forEach((f,i) => setTimeout(() => beep(f, 0.1, 'sine', 0.13), i*70)); }

// ═══════════════════════════════════════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════════════════════════════════════
function spawnConfetti() {
  const colors = ['#f9e44a','#2979ff','#ff6d00','#43a047','#e53935','#ffffff','#7c4dff'];
  for (let i = 0; i < 80; i++) {
    confetti.push({
      x: Math.random() * W, y: -10,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 4 + 2,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2,
      life: 1,
    });
  }
}
function updateConfetti() {
  confetti = confetti.filter(c => c.life > 0);
  confetti.forEach(c => {
    c.x += c.vx; c.y += c.vy; c.rot += c.rotV;
    c.vy += 0.1; c.life -= 0.008;
  });
}
function drawConfetti(ctx) {
  confetti.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = c.life;
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/4, c.size, c.size/2);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  v3b POWER-UP HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
function resetSpawnCountdown() {
  spawnCountdown = POWERUP_SPAWN_MIN + Math.floor(Math.random() * (POWERUP_SPAWN_MAX - POWERUP_SPAWN_MIN));
}

function spawnPowerup() {
  // Place it randomly in the middle third of the court (away from paddles)
  const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  activePowerup = {
    x: W * 0.3 + Math.random() * W * 0.4,
    y: H * 0.2 + Math.random() * H * 0.6,
    type,
    pulse: 0,   // animation tick
  };
}

// Apply a power-up to a paddle side
function applyEffect(side, typeId) {
  const def = POWERUP_TYPES.find(t => t.id === typeId);
  if (side === 'player') playerEffect = { id: typeId, framesLeft: def.duration };
  else                   cpuEffect    = { id: typeId, framesLeft: def.duration };
  flashMsg = { text: def.emoji + ' ' + def.label, color: def.color, life: 1 };
  playPowerup();
}

function effectivePaddleH(side) {
  const eff = side === 'player' ? playerEffect : cpuEffect;
  if (eff && eff.id === 'grow') return PADDLE_H + GROW_BONUS;
  return PADDLE_H;
}

function effectiveBallSpeed() {
  if ((playerEffect && playerEffect.id === 'speed') ||
      (cpuEffect    && cpuEffect.id    === 'speed')) {
    return BALL_SPEED_MAX * 0.7;  // not quite max — exciting but hittable
  }
  return null;  // null = no override
}

function effectiveMissFactor(baseMiss) {
  // aim assist: player's return is more accurate; CPU is less accurate
  const pe = playerEffect && playerEffect.id === 'aim';
  const ce = cpuEffect    && cpuEffect.id    === 'aim';
  if (pe) return Math.min(baseMiss * (1 / AIM_REDUCTION), 0.98);  // player more accurate
  if (ce) return baseMiss * AIM_REDUCTION;                         // CPU less accurate
  return baseMiss;
}

function tickEffects() {
  if (playerEffect) {
    playerEffect.framesLeft--;
    if (playerEffect.framesLeft <= 0) playerEffect = null;
  }
  if (cpuEffect) {
    cpuEffect.framesLeft--;
    if (cpuEffect.framesLeft <= 0) cpuEffect = null;
  }
  if (flashMsg) {
    flashMsg.life -= 0.015;
    if (flashMsg.life <= 0) flashMsg = null;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════════════════════════════════
function resetBall(server = 'player') {
  const angle = (Math.random() * 40 - 20) * Math.PI / 180;
  const dir = server === 'player' ? 1 : -1;
  ball = {
    x: W / 2, y: H / 2,
    vx: dir * BALL_SPEED_INIT * Math.cos(angle),
    vy: BALL_SPEED_INIT * Math.sin(angle),
  };
  ballSpeedMult = 1;
}
function resetPaddles() {
  playerPad = { x: PLAYER_X, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
  cpuPad    = { x: CPU_X,    y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H };
}
function startGame() {
  playerScore = 0; cpuScore = 0;
  confetti = [];
  activePowerup = null;
  playerEffect = null;
  cpuEffect = null;
  flashMsg = null;
  resetSpawnCountdown();
  resetPaddles();
  resetBall('player');
  phase = 'serve';
}

// ═══════════════════════════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════════════════════════
function updatePlay() {
  const diff = DIFFICULTY[currentDiff];

  tickEffects();

  // Paddle heights driven by grow effect
  const ph = effectivePaddleH('player');
  const ch = effectivePaddleH('cpu');

  // Player 1 keyboard
  if ((keys['ArrowUp']   || keys['w'] || keys['W']) && playerPad.y > 0)
    playerPad.y -= PLAYER_SPEED;
  if ((keys['ArrowDown'] || keys['s'] || keys['S']) && playerPad.y < H - ph)
    playerPad.y += PLAYER_SPEED;

  // Player 2 or CPU
  if (twoPlayer) {
    if ((keys['i'] || keys['I']) && cpuPad.y > 0)             cpuPad.y -= PLAYER_SPEED;
    if ((keys['k'] || keys['K']) && cpuPad.y < H - ch)        cpuPad.y += PLAYER_SPEED;
  } else {
    const center = cpuPad.y + ch / 2;
    const miss   = effectiveMissFactor(diff.missFactor);
    const target = ball.y * miss + (H / 2) * (1 - miss);
    const spd    = diff.cpuSpeed;
    if (center < target - 5 && cpuPad.y < H - ch) cpuPad.y += spd;
    else if (center > target + 5 && cpuPad.y > 0)  cpuPad.y -= spd;
  }

  // Ball movement
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Wall bounce
  if (ball.y - BALL_R <= 0)  { ball.y = BALL_R;        ball.vy =  Math.abs(ball.vy); playWall(); }
  if (ball.y + BALL_R >= H)  { ball.y = H - BALL_R;    ball.vy = -Math.abs(ball.vy); playWall(); }

  function paddleHit(pad, padH, newVxSign, side) {
    const hitPos = (ball.y - pad.y) / padH - 0.5;
    ball.vx = newVxSign * Math.abs(ball.vx);
    ball.vy = hitPos * 9;
    ballSpeedMult = Math.min(ballSpeedMult + BALL_SPEED_INC / BALL_SPEED_INIT, BALL_SPEED_MAX / BALL_SPEED_INIT);
    // Speed boost effect: kick ball faster on next hit
    const spdOvr = effectiveBallSpeed();
    if (spdOvr) {
      const spd = spdOvr;
      const len = Math.hypot(ball.vx, ball.vy);
      ball.vx = (ball.vx / len) * spd;
      ball.vy = (ball.vy / len) * spd;
    } else {
      ball.vx *= ballSpeedMult;
      ball.vy *= ballSpeedMult;
    }
    playPock();
  }

  // Player paddle
  if (ball.vx < 0 &&
      ball.x - BALL_R <= playerPad.x + playerPad.w &&
      ball.x - BALL_R >= playerPad.x - 4 &&
      ball.y + BALL_R >= playerPad.y &&
      ball.y - BALL_R <= playerPad.y + ph) {
    paddleHit(playerPad, ph, 1, 'player');
    ball.x = playerPad.x + playerPad.w + BALL_R;
  }

  // CPU / P2 paddle
  if (ball.vx > 0 &&
      ball.x + BALL_R >= cpuPad.x &&
      ball.x + BALL_R <= cpuPad.x + cpuPad.w + 4 &&
      ball.y + BALL_R >= cpuPad.y &&
      ball.y - BALL_R <= cpuPad.y + ch) {
    paddleHit(cpuPad, ch, -1, 'cpu');
    ball.x = cpuPad.x - BALL_R;
  }

  // v3b: power-up spawn & collection
  spawnCountdown--;
  if (spawnCountdown <= 0 && !activePowerup) {
    spawnPowerup();
  }
  if (activePowerup) {
    activePowerup.pulse++;
    const dx = ball.x - activePowerup.x;
    const dy = ball.y - activePowerup.y;
    if (Math.hypot(dx, dy) < BALL_R + POWERUP_RADIUS) {
      // Ball collected it — give effect to the side that last hit
      const side = ball.vx > 0 ? 'player' : 'cpu';
      applyEffect(side, activePowerup.type.id);
      activePowerup = null;
      resetSpawnCountdown();
    }
  }

  // Scoring
  if (ball.x + BALL_R < 0)  { cpuScore++;    lastScorer = 'cpu';    playCheer(); endPoint(); }
  if (ball.x - BALL_R > W)  { playerScore++; lastScorer = 'player'; playCheer(); endPoint(); }
}

function endPoint() {
  activePowerup = null;
  playerEffect = null;
  cpuEffect = null;
  resetSpawnCountdown();

  if (playerScore >= CONFIG.scoreToWin || cpuScore >= CONFIG.scoreToWin) {
    const playerWon = playerScore >= CONFIG.scoreToWin;
    if (playerWon) { stats.wins++; stats.streak++; stats.bestStreak = Math.max(stats.streak, stats.bestStreak); }
    else           { stats.losses++; stats.streak = 0; }
    saveStats();
    spawnConfetti();
    playWin();
    phase = 'end';
  } else {
    phase = 'point';
    pointDelay = 80;
  }
}

function update() {
  if (phase === 'play')  { updatePlay(); updateConfetti(); }
  if (phase === 'end')   { updateConfetti(); }
  if (phase === 'point') {
    pointDelay--;
    if (pointDelay <= 0) {
      resetPaddles();
      resetBall(lastScorer === 'cpu' ? 'cpu' : 'player');
      phase = 'serve';
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function theme() { return CONFIG.themes[currentTheme]; }

function drawCourt() {
  const t = theme();
  const sky = ctx.createLinearGradient(0, 0, 0, 70);
  sky.addColorStop(0, t.sky);
  sky.addColorStop(1, t.court);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, 70);
  ctx.fillStyle = t.court;
  ctx.fillRect(0, 70, W, H - 70);
  ctx.fillStyle = t.courtAlt;
  ctx.fillRect(W*0.25, H*0.15, W*0.25, H*0.7);
  ctx.fillRect(W*0.5,  H*0.15, W*0.25, H*0.7);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.setLineDash([12, 8]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
  [[W*0.25,H*0.15,W*0.75,H*0.15],[W*0.25,H*0.85,W*0.75,H*0.85],
   [W*0.25,H*0.15,W*0.25,H*0.85],[W*0.75,H*0.15,W*0.75,H*0.85]].forEach(([x1,y1,x2,y2]) => {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
}

function paddleColor(side) {
  const eff = side === 'player' ? playerEffect : cpuEffect;
  if (!eff) return side === 'player' ? theme().playerPad : theme().cpuPad;
  const def = POWERUP_TYPES.find(t => t.id === eff.id);
  return def.color;
}

function drawPaddle(pad, side) {
  const ph = effectivePaddleH(side);
  const color = paddleColor(side);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(pad.x, pad.y, pad.w, ph, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.roundRect(pad.x+2, pad.y+4, pad.w-4, ph/3, 4); ctx.fill();

  // Active effect icon above paddle
  const eff = side === 'player' ? playerEffect : cpuEffect;
  if (eff) {
    const def = POWERUP_TYPES.find(t => t.id === eff.id);
    const pct = eff.framesLeft / def.duration;
    // tiny progress bar
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(pad.x - 1, pad.y - 10, pad.w + 2, 6);
    ctx.fillStyle = def.color;
    ctx.fillRect(pad.x - 1, pad.y - 10, (pad.w + 2) * pct, 6);
  }
}

function drawBall() {
  const t = theme();
  if (currentBallEmoji) {
    ctx.font = `${BALL_R * 2.2}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(currentBallEmoji, ball.x, ball.y);
    ctx.textBaseline = 'alphabetic';
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(ball.x+3, ball.y+3, BALL_R, BALL_R*0.7, 0, 0, Math.PI*2); ctx.fill();
    const g = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, BALL_R);
    g.addColorStop(0, t.ballInner); g.addColorStop(1, t.ball);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(150,100,0,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*0.7, 0.3, Math.PI+0.3); ctx.stroke();
  }
}

// v3b: draw floating power-up item on court
function drawActivePowerup() {
  if (!activePowerup) return;
  const { x, y, type, pulse } = activePowerup;
  const scale = 1 + 0.12 * Math.sin(pulse * 0.12);
  const alpha = 0.85 + 0.15 * Math.sin(pulse * 0.1);

  // Glow ring
  ctx.save();
  ctx.globalAlpha = alpha * 0.45;
  ctx.fillStyle = type.color;
  ctx.beginPath();
  ctx.arc(x, y, (POWERUP_RADIUS + 6) * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // White circle background
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(x, y, POWERUP_RADIUS * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Emoji icon
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.font = `${POWERUP_RADIUS * 1.3 * scale}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(type.emoji, x, y);
  ctx.restore();
}

// v3b: flash message when power-up collected
function drawFlashMsg() {
  if (!flashMsg || flashMsg.life <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(flashMsg.life * 2, 1);
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = flashMsg.color;
  const scale = 1 + (1 - flashMsg.life) * 0.3;
  ctx.translate(W / 2, H / 2 - 60);
  ctx.scale(scale, scale);
  ctx.fillText(flashMsg.text, 0, 0);
  ctx.restore();
}

function drawScore() {
  const p2Label = twoPlayer ? p2Name : 'BOB';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px Arial';
  ctx.fillText(playerScore, W/2 - 75, 50);
  ctx.fillText(cpuScore,    W/2 + 75, 50);
  ctx.font = 'bold 26px Arial';
  ctx.fillText('—', W/2, 50);
  ctx.font = '13px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(playerName.toUpperCase().slice(0,8), W/2 - 75, 64);
  ctx.fillText(p2Label.toUpperCase().slice(0,8),     W/2 + 75, 64);

  ctx.font = '12px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.textAlign = 'left';
  ctx.fillText(`W:${stats.wins}  L:${stats.losses}  🔥${stats.streak}`, 8, H - 8);
  ctx.textAlign = 'right';
  ctx.fillText(`Best streak: ${stats.bestStreak}`, W - 8, H - 8);
}

function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill)   { ctx.fillStyle = fill;   ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function bigButton(label, x, y, w, h, color, textColor = '#fff') {
  roundRect(x, y, w, h, 12, color);
  roundRect(x, y, w, h, 12, null, 'rgba(255,255,255,0.3)');
  ctx.fillStyle = textColor;
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w/2, y + h/2 + 9);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: NAME ENTRY
// ═══════════════════════════════════════════════════════════════════════════════
function drawNameScreen() {
  const t = theme();
  ctx.fillStyle = t.court;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 52px Arial';
  ctx.fillText(CONFIG.gameTitle, W/2, 90);

  ctx.font = '16px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(CONFIG.nonprofitName + '  ·  ' + CONFIG.poweredBy, W/2, 118);

  const asking = namingP2 ? 'Player 2 name:' : 'Your name:';
  const buf    = namingP2 ? p2Buffer : nameBuffer;

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(asking, W/2, 200);

  roundRect(W/2 - 160, 218, 320, 54, 8, 'rgba(255,255,255,0.15)', 'rgba(255,255,255,0.6)');
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px Arial';
  ctx.fillText((buf || '_') + (Math.floor(Date.now()/500) % 2 ? '|' : ''), W/2, 254);

  ctx.font = '16px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Type your name and press Enter', W/2, 298);
  ctx.font = '14px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('(press Enter to use default)', W/2, 322);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SETUP
// ═══════════════════════════════════════════════════════════════════════════════
function drawSetupScreen() {
  const t = theme();
  ctx.fillStyle = t.court;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px Arial';
  ctx.fillText('Game Setup', W/2, 52);

  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Difficulty', W/2, 88);

  const diffs = Object.keys(DIFFICULTY);
  diffs.forEach((d, i) => {
    const bw = 150, bh = 46, gap = 20;
    const totalW = diffs.length * bw + (diffs.length - 1) * gap;
    const bx = W/2 - totalW/2 + i * (bw + gap);
    const by = 96;
    const isSelected = setupSelection.diff === d;
    roundRect(bx, by, bw, bh, 10, isSelected ? DIFFICULTY[d].color : 'rgba(255,255,255,0.15)', isSelected ? '#fff' : 'rgba(255,255,255,0.3)');
    ctx.fillStyle = '#fff';
    ctx.font = isSelected ? 'bold 20px Arial' : '18px Arial';
    ctx.fillText(DIFFICULTY[d].label, bx + bw/2, by + bh/2 + 7);
    setupBtns['diff_' + d] = { x: bx, y: by, w: bw, h: bh };
  });

  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'center';
  ctx.fillText('Court Theme', W/2, 190);

  const themes = Object.keys(CONFIG.themes);
  themes.forEach((th, i) => {
    const bw = 150, bh = 46, gap = 20;
    const totalW = themes.length * bw + (themes.length - 1) * gap;
    const bx = W/2 - totalW/2 + i * (bw + gap);
    const by = 198;
    const isSelected = setupSelection.theme === th;
    roundRect(bx, by, bw, bh, 10, isSelected ? CONFIG.themes[th].court : 'rgba(255,255,255,0.12)', isSelected ? '#fff' : 'rgba(255,255,255,0.25)');
    ctx.fillStyle = '#fff';
    ctx.font = isSelected ? 'bold 18px Arial' : '16px Arial';
    ctx.fillText(CONFIG.themes[th].name, bx + bw/2, by + bh/2 + 6);
    setupBtns['theme_' + th] = { x: bx, y: by, w: bw, h: bh };
  });

  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'center';
  ctx.fillText('Ball Style', W/2, 296);

  const emojis = ['🎾', ...CONFIG.ballEmojis.slice(1), '●'];
  const bSize = 54, bGap = 14;
  const totalEW = emojis.length * bSize + (emojis.length-1) * bGap;
  emojis.forEach((e, i) => {
    const bx = W/2 - totalEW/2 + i*(bSize+bGap);
    const by = 304;
    const isSelected = setupSelection.emoji === i;
    roundRect(bx, by, bSize, bSize, 10, isSelected ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.1)', isSelected ? '#fff' : 'rgba(255,255,255,0.2)');
    ctx.font = e === '●' ? '28px Arial' : '28px serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = e === '●' ? theme().ball : '#fff';
    ctx.fillText(e, bx + bSize/2, by + bSize/2 + 10);
    setupBtns['emoji_' + i] = { x: bx, y: by, w: bSize, h: bSize };
  });

  ctx.font = 'bold 18px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'center';
  ctx.fillText('Mode', W/2, 408);

  ['1 Player  🤖', '2 Players  👥'].forEach((label, i) => {
    const bw = 200, bh = 48, gap = 24;
    const totalW = 2*bw + gap;
    const bx = W/2 - totalW/2 + i*(bw+gap);
    const by = 416;
    const isSelected = setupSelection.twoPlayer === (i === 1);
    roundRect(bx, by, bw, bh, 10, isSelected ? '#1565c0' : 'rgba(255,255,255,0.12)', isSelected ? '#fff' : 'rgba(255,255,255,0.25)');
    ctx.fillStyle = '#fff';
    ctx.font = isSelected ? 'bold 18px Arial' : '16px Arial';
    ctx.fillText(label, bx + bw/2, by + bh/2 + 7);
    setupBtns['mode_' + i] = { x: bx, y: by, w: bw, h: bh };
  });

  const sbx = W/2 - 110, sby = 488;
  bigButton('▶  START', sbx, sby, 220, 54, '#2e7d32');
  setupBtns['start'] = { x: sbx, y: sby, w: 220, h: 54 };

  ctx.font = '13px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.textAlign = 'center';
  ctx.fillText('v3b: ⚡ speed  🛡️ big paddle  🎯 aim assist — power-ups appear on court!', W/2, H - 8);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: SERVE PROMPT
// ═══════════════════════════════════════════════════════════════════════════════
function drawServePrompt() {
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '18px Arial';
  ctx.textAlign = 'center';
  const hint = twoPlayer
    ? `${playerName}: ↑↓ / WS    ${p2Name}: I K  —  Space to serve`
    : 'Arrow keys  ↑↓  or  W S  to move  ·  Space or tap to serve';
  ctx.fillText(hint, W/2, H - 18);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SCREEN: END
// ═══════════════════════════════════════════════════════════════════════════════
function drawEndScreen() {
  const playerWon = playerScore >= CONFIG.scoreToWin;
  const winner = playerWon ? playerName : (twoPlayer ? p2Name : 'BOB');
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 64px Arial';
  ctx.fillText(playerWon ? '🏆 ' + winner + ' WINS!' : '🤖 ' + winner + ' WINS!', W/2, H/2 - 80);

  ctx.font = '24px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(playerWon ? 'Amazing rally! 🎾' : 'So close! Try again?', W/2, H/2 - 30);

  ctx.font = '18px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(`Wins: ${stats.wins}  ·  Losses: ${stats.losses}  ·  Best streak: ${stats.bestStreak}`, W/2, H/2 + 10);

  bigButton('▶  PLAY AGAIN', W/2 - 120, H/2 + 40, 240, 56, playerWon ? '#2e7d32' : '#b71c1c');
  bigButton('⚙  SETUP',      W/2 - 80,  H/2 + 112, 160, 46, 'rgba(255,255,255,0.2)');
}

// ═══════════════════════════════════════════════════════════════════════════════
//  MAIN DRAW
// ═══════════════════════════════════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0, 0, W, H);

  if (phase === 'name')  { drawNameScreen(); return; }
  if (phase === 'setup') { drawSetupScreen(); return; }

  drawCourt();
  drawScore();
  drawActivePowerup();          // v3b: power-up item floating on court
  drawPaddle(playerPad, 'player');
  drawPaddle(cpuPad,    'cpu');
  drawBall();
  drawFlashMsg();               // v3b: pickup flash
  drawConfetti(ctx);

  if (phase === 'serve') drawServePrompt();

  if (phase === 'point') {
    const scored = lastScorer === 'player' ? playerName + ' scores! 🎾' : (twoPlayer ? p2Name : 'BOB') + ' scores!';
    const col = lastScorer === 'player' ? '#2e7d32' : '#c62828';
    ctx.fillStyle = col; ctx.globalAlpha = 0.75;
    ctx.fillRect(0, H/2 - 38, W, 66);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px Arial'; ctx.textAlign = 'center';
    ctx.fillText(scored, W/2, H/2 + 8);
  }

  if (phase === 'end') drawEndScreen();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════════════════════════
function loop() { update(); draw(); requestAnimationFrame(loop); }

// ═══════════════════════════════════════════════════════════════════════════════
//  INPUT — KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  keys[e.key] = true;

  if (phase === 'name') {
    if (e.key === 'Enter') {
      const buf = namingP2 ? p2Buffer : nameBuffer;
      if (!namingP2) {
        playerName = buf.trim() || 'YOU';
        if (setupSelection.twoPlayer) { namingP2 = true; p2Buffer = ''; }
        else { phase = 'setup'; }
      } else {
        p2Name = buf.trim() || 'P2';
        phase = 'setup';
      }
      playClick(); return;
    }
    if (e.key === 'Backspace') {
      if (namingP2) p2Buffer = p2Buffer.slice(0, -1);
      else          nameBuffer = nameBuffer.slice(0, -1);
      return;
    }
    if (e.key.length === 1 && /[a-zA-Z0-9 ]/.test(e.key)) {
      const limit = 10;
      if (!namingP2 && nameBuffer.length < limit) nameBuffer += e.key;
      if (namingP2  && p2Buffer.length  < limit) p2Buffer  += e.key;
    }
    return;
  }

  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleAction(); }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function handleAction() {
  if (phase === 'serve') { phase = 'play'; playClick(); }
  if (phase === 'end')   { startGame(); }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  INPUT — MOUSE / TOUCH
// ═══════════════════════════════════════════════════════════════════════════════
function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
}
function hitBtn(pt, btn) {
  return pt.x >= btn.x && pt.x <= btn.x + btn.w && pt.y >= btn.y && pt.y <= btn.y + btn.h;
}
function handleClick(pt) {
  playClick();
  if (phase === 'setup') {
    for (const [key, btn] of Object.entries(setupBtns)) {
      if (!hitBtn(pt, btn)) continue;
      if (key.startsWith('diff_'))  { setupSelection.diff     = key.slice(5); }
      if (key.startsWith('theme_')) { setupSelection.theme    = key.slice(6); currentTheme = key.slice(6); }
      if (key.startsWith('emoji_')) { setupSelection.emoji    = parseInt(key.slice(6)); }
      if (key.startsWith('mode_'))  { setupSelection.twoPlayer = key === 'mode_1'; }
      if (key === 'start') {
        currentDiff     = setupSelection.diff;
        currentTheme    = setupSelection.theme;
        twoPlayer       = setupSelection.twoPlayer;
        const emojis = ['🎾', ...CONFIG.ballEmojis.slice(1), null];
        currentBallEmoji = emojis[setupSelection.emoji] === '●' ? null : emojis[setupSelection.emoji];
        if (twoPlayer && p2Name === 'P2') { namingP2 = true; p2Buffer = ''; phase = 'name'; }
        else { startGame(); }
      }
    }
    return;
  }
  if (phase === 'serve') { phase = 'play'; return; }
  if (phase === 'end') {
    const playBtn  = { x: W/2-120, y: H/2+40,  w: 240, h: 56 };
    const setupBtn = { x: W/2-80,  y: H/2+112, w: 160, h: 46 };
    if (hitBtn(pt, playBtn))  { startGame(); return; }
    if (hitBtn(pt, setupBtn)) { namingP2 = false; phase = 'name'; return; }
    startGame();
  }
}
function movePaddle(pt) {
  if (phase !== 'play' && phase !== 'serve') return;
  if (pt.x < W / 2)
    playerPad.y = Math.max(0, Math.min(H - effectivePaddleH('player'), pt.y - PADDLE_H / 2));
  else if (twoPlayer)
    cpuPad.y = Math.max(0, Math.min(H - effectivePaddleH('cpu'), pt.y - PADDLE_H / 2));
}
canvas.addEventListener('click', e => { handleClick(canvasPoint(e)); });
canvas.addEventListener('mousemove', e => { movePaddle(canvasPoint(e)); });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  Array.from(e.touches).forEach(t => movePaddle(canvasPoint({ clientX: t.clientX, clientY: t.clientY })));
}, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleClick(canvasPoint(e)); }, { passive: false });

document.getElementById('muteBtn').addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  e.target.textContent = muted ? '🔇' : '🔊';
});

// ═══════════════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════════════
resetSpawnCountdown();
resetPaddles();
resetBall('player');
loop();
</script>
